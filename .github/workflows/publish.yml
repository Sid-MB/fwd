# Release automation is shared with Interlens so version bumps, tags, provenance attestations, distributions, and
# GitHub Releases stay consistent across Sid-MB Python projects. PyPI publishing deliberately remains here: Trusted
# Publishing identifies this repository and workflow, and the local `pypi` environment is its security boundary.
name: Publish

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "man/**"
      - "pyproject.toml"
      - "README.md"
      - "SKILL.md"
      - "agents/**"
      - "references/**"
      - "hatch_build.py"
      - "tools/generate_man_pages.py"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

jobs:
  validate-manual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - run: uv sync --frozen --all-extras --dev
        env:
          UV_PYTHON: "3.12"

      # Validate fresh output here; the isolated shared build independently invokes the Hatch hook below.
      - run: uv run python tools/generate_man_pages.py

      - name: Lint manual pages
        run: |
          sudo apt-get update
          sudo apt-get install --yes mandoc
          mandoc -T lint man/*.1

  build-and-release:
    needs: validate-manual
    # Pinning to main is intentional: this is the centrally maintained release workflow requested for Sid-MB projects.
    uses: Sid-MB/interlens/.github/workflows/publish.yml@main
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      # fwd does not currently carry Interlens's .licenserc.yaml/header-hook setup.
      license: false
      # The reusable workflow builds, attests, tags, and uploads `python-package-distributions`. Publishing and the
      # GitHub Release remain local so a failed PyPI upload cannot leave behind a release for unpublished artifacts.
      publish: false
      release: false
      # After releasing on main, dispatch sidmb's sync-ext-docs.yml so the published docs/ tree is re-rendered
      # on the website. The reusable workflow derives `source=fwd` from this repository's name.
      docsync: true
    secrets:
      DOCSYNC_GITHUB_TOKEN: ${{ secrets.DOCSYNC_GITHUB_TOKEN }}

  publish:
    needs: build-and-release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      # fwd loads this script from its installed wheel to bootstrap remote machines. Keep the package-specific guard
      # here even though the shared workflow already built and attested the distributions.
      - name: Verify the wheel ships bootstrap.sh
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel" || { echo "::error::No wheel found in the shared workflow artifact"; exit 1; }
          unzip -l "$wheel" > wheel-contents.txt
          grep -q 'fwd/scripts/bootstrap.sh' wheel-contents.txt || { echo "::error::bootstrap.sh missing from $wheel"; exit 1; }
          grep -q 'fwd/man/fwd.1' wheel-contents.txt || { echo "::error::fwd.1 missing from $wheel"; exit 1; }
          grep -q 'fwd/man/fwd-up.1' wheel-contents.txt || { echo "::error::fwd-up.1 missing from $wheel"; exit 1; }

      # The wheel carries runtime copies; the sdist also carries packager-ready pages and their reproducible generator.
      - name: Verify the source distribution ships manual pages
        run: |
          sdist=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$sdist" || { echo "::error::No source distribution found in the shared workflow artifact"; exit 1; }
          tar -tzf "$sdist" > sdist-contents.txt
          grep -Eq '/man/fwd\.1$' sdist-contents.txt || { echo "::error::fwd.1 missing from $sdist"; exit 1; }
          grep -Eq '/man/fwd-up\.1$' sdist-contents.txt || { echo "::error::fwd-up.1 missing from $sdist"; exit 1; }
          grep -Eq '/tools/generate_man_pages\.py$' sdist-contents.txt || { echo "::error::manual generator missing from $sdist"; exit 1; }
          grep -Eq '/hatch_build\.py$' sdist-contents.txt || { echo "::error::manual build hook missing from $sdist"; exit 1; }

      # No username or password is supplied: the action exchanges GitHub's OIDC identity for a short-lived PyPI
      # credential scoped to this repository, publish.yml, and the pypi environment.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      # The shared workflow has already pushed the matching tag. Creating the release only after PyPI accepts the
      # immutable distributions keeps the public GitHub and PyPI release states aligned.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks out the repository, so gh cannot infer the target from a local git remote: name it explicitly.
          GH_REPO: ${{ github.repository }}
        run: |
          wheel=$(find dist -maxdepth 1 -name 'fwdit-*.whl' -print -quit)
          test -n "$wheel" || { echo "::error::No fwdit wheel found in the shared workflow artifact"; exit 1; }
          version=${wheel#dist/fwdit-}
          version=${version%%-*}
          gh release create "v$version" dist/*.whl dist/*.tar.gz --generate-notes
