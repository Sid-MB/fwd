[project]
name = "fwd"
version = "0.1.0"
description = "Move coding work and agent sessions to remote compute"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "tomlkit>=0.13",
]

[project.scripts]
fwd = "fwd.cli:entrypoint"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fwd"]

# bootstrap.sh must land inside the installed package so remote.BOOTSTRAP_PATH can resolve it via importlib.resources.
[tool.hatch.build.targets.wheel.force-include]
"src/fwd/scripts/bootstrap.sh" = "fwd/scripts/bootstrap.sh"
"SKILL.md" = "fwd/SKILL.md"
"agents" = "fwd/skill_agents"
"references" = "fwd/references"
".codex-plugin/plugin.json" = "fwd/.codex-plugin/plugin.json"
"skills" = "fwd/skills"

[tool.hatch.build.targets.sdist]
include = ["src/fwd", "tests", "README.md", "/SKILL.md", "/agents", "/references", "/skills", "/.codex-plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
