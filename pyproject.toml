[project]
name = "fwdit"
dynamic = ["version"]
description = "Move coding work and agent sessions to remote compute"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prompt-toolkit>=3.0",
    "typer>=0.12",
    "rich>=13",
    "tomlkit>=0.13",
]

[project.scripts]
fwd = "fwd.cli:entrypoint"

[dependency-groups]
dev = [
    "click-man>=0.5.1,<0.6",
    "pytest>=8",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
# The shared release workflow creates the next vX.Y.Z tag before building, so the wheel, sdist, Git tag, and GitHub Release all receive the same immutable version.
source = "vcs"

[tool.hatch.version.raw-options]
# Source archives without Git metadata still expose a valid diagnostic version instead of failing to build.
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/fwd"]

# Generate the manuals inside every wheel and sdist build so releases never depend on checked-in generated files.
[tool.hatch.build.hooks.custom]
require-runtime-dependencies = true
dependencies = ["click-man>=0.5.1,<0.6"]

# Runtime scripts, skills, references, and manuals must land inside the installed package for importlib.resources.
[tool.hatch.build.targets.wheel.force-include]
"src/fwd/scripts/bootstrap.sh" = "fwd/scripts/bootstrap.sh"
"src/fwd/scripts/codex_tui_send.py" = "fwd/scripts/codex_tui_send.py"
"SKILL.md" = "fwd/SKILL.md"
"agents" = "fwd/skill_agents"
"man" = "fwd/man"
"references" = "fwd/references"

[tool.hatch.build.targets.sdist]
include = ["src/fwd", "tests", "README.md", "/SKILL.md", "/agents", "/hatch_build.py", "/man", "/references", "/tools"]

# Generated manuals are Git-ignored, so they must override Hatch's VCS exclusion when collecting an sdist.
[tool.hatch.build.targets.sdist.force-include]
"man" = "man"

[tool.pytest.ini_options]
testpaths = ["tests"]
