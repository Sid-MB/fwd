[project]
name = "fwd"
version = "0.1.0"
description = "Forward your Claude Code session to a remote machine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "tomlkit>=0.13",
]

[project.scripts]
fwd = "fwd.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fwd"]

# bootstrap.sh must land inside the installed package so remote.BOOTSTRAP_PATH can resolve it via importlib.resources.
[tool.hatch.build.targets.wheel.force-include]
"src/fwd/scripts/bootstrap.sh" = "fwd/scripts/bootstrap.sh"
"SKILL.md" = "fwd/SKILL.md"

[tool.hatch.build.targets.sdist]
include = ["src/fwd", "tests", "README.md", "/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
